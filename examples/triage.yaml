version: 1
locale: zh-CN
name: support-triage
revision: "1"
start: classify
limits:
  max_steps: 12
  max_calls: 2
  timeout_seconds: 60
nodes:
  classify:
    type: evaluate
    state:
      message: {$ref: input.message}
    questions:
      intent:
        type: choice
        instructions: 哪个部门最适合处理客户的消息？
        criteria:
          billing: 收费、发票、重复付款或退款。
          technical: 登录问题、程序错误或服务故障。
          other: 以上部门均不适合，或信息不足。
      urgent:
        type: noul
        instructions: 消息是否描述当前服务中断或必须立即处理的需求？
    next: route
  route:
    type: branch
    cases:
      - left: {$ref: nodes.classify.urgent.noul}
        op: gte
        right: 0.8 # Illustrative threshold; validate against actual outcomes.
        next: review
      - left: {$ref: nodes.classify.intent.choice}
        op: eq
        right: other
        next: review
      - left: {$ref: nodes.classify.intent.choice}
        op: eq
        right: billing
        next: assess_billing
    default: technical
  assess_billing:
    type: evaluate
    state:
      message: {$ref: input.message}
      prior_intent: {$ref: nodes.classify.intent.choice}
    questions:
      specificity:
        type: score
        instructions: 这条消息对账单问题的描述有多具体？
        criteria:
          - 无法识别账单问题。
          - 提到账单顾虑，但问题不明确。
          - 描述具体账单问题，例如重复扣款。
    next: billing_route
  billing_route:
    type: branch
    cases:
      - left: {$ref: nodes.assess_billing.specificity.score}
        op: gte
        right: 1.5
        next: billing
    default: review
  billing:
    type: return
    value: {route: billing}
  technical:
    type: return
    value: {route: technical}
  review:
    type: return
    value: {route: agent_review}
